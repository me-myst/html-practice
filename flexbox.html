<!doctype html>
<html>
  <head>
    <title>Flexbox Practice</title>
    <style>
      .container {
        display: flex;
        justify-content: space-around;
        background: #eee;
        padding: 20px;
      }
      .box {
        background: #0066cc;
        color: white;
        padding: 30px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
    </div>
  </body>
</html>
